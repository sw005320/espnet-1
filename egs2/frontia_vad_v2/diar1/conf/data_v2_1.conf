# frontia_vad_v2 labels v2.1 (local/data.sh --config conf/data_v2_1.conf, sourced as shell): the corpora
# labelled by alignment (label source A) prepared again with their transcript clips kept
# inside packs, and aligned per clip with token timing. The other corpora are reused from
# dump/v2; the combined sets go to dump_v2_1/raw (diar.sh --dumpdir dump_v2_1), so dump/v2,
# dump/raw and the models trained on them stay as they are.
#
# The padding and the in-clip min_pause are NOT decided yet (Shinji decides; see
# local/v2/align_label_check.py and the padding table on AMI dev and LibriSpeech dev).
# Until then stage 4 aligns with no padding and min_pause 0.2 s, and the labels are
# written again from align.tsv by local/v2/relabel.py once they are chosen; do not
# run stage 5 with this config before that.
label_source=A
dumpdir=dump/v2_1
reuse_dumpdir=dump/v2
raw_dir=dump_v2_1/raw
align_word_timing=tokens
align_clip_mode=true
