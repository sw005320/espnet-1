# Neural HMM forced aligner on LibriSpeech 100 h: the librispeech_100 asr1
# E-Branchformer encoder (12 blocks, d 256), character units, 3-state
# left-to-right HMMs, one optional 1-state <sil> (Kaldi-style, entered with
# probability 0.5), full-sum loss from a flat start, plus forward and
# time-reversed CTC heads. Output frames: 10 ms, no subsampling (conv2d1).
encoder: e_branchformer
encoder_conf:
    output_size: 256
    attention_heads: 4
    attention_layer_type: rel_selfattn
    pos_enc_layer_type: rel_pos
    rel_pos_type: latest
    cgmlp_linear_units: 1024
    cgmlp_conv_kernel: 31
    use_linear_after_conv: false
    gate_activation: identity
    num_blocks: 12
    dropout_rate: 0.1
    positional_dropout_rate: 0.1
    attention_dropout_rate: 0.1
    input_layer: conv2d1
    layer_drop_rate: 0.0
    linear_units: 1024
    positionwise_layer_type: linear
    use_ffn: true
    macaron_ffn: true
    merge_conv_kernel: 31

model_conf:
    num_states: 3
    pause_units: ["<sil>"]
    pause_num_states: 1
    pause_prob: 0.5
    boundary_is_unit: true
    loop_prob: 0.5
    upsample: none
    upsample_factor: 1
    hmm_weight: 1.0
    fwd_ctc_weight: 0.3
    bwd_ctc_weight: 0.3
    prior_scale: 0.0

frontend_conf:
    n_fft: 512
    win_length: 400
    hop_length: 160

seed: 2022
num_workers: 4
batch_type: numel
batch_bins: 4000000
accum_grad: 16
max_epoch: 70
patience: none
init: none
best_model_criterion:
-   - valid
    - loss_hmm
    - min
keep_nbest_models: 10
use_amp: true

optim: adam
optim_conf:
    lr: 0.002
    weight_decay: 0.000001
scheduler: warmuplr
scheduler_conf:
    warmup_steps: 15000

# no time warping: it moves the boundaries the aligner learns
specaug: specaug
specaug_conf:
    apply_time_warp: false
    apply_freq_mask: true
    freq_mask_width_range:
    - 0
    - 27
    num_freq_mask: 2
    apply_time_mask: true
    time_mask_width_ratio_range:
    - 0.
    - 0.05
    num_time_mask: 5
